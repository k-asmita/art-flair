<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist Sign In | Art Flair - Sabahz Trading</title>
  <meta name="description" content="Sign in to your Art Flair studio patron account to sync your database cart, order history, and saved archival palettes." />
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- Dynamic Global Header -->
  <div id="site-header-container"></div>

  <main class="main-content section-padding">
    <div class="container container-narrow">
      <div style="max-width: 460px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 40px 32px; box-shadow: var(--shadow-lg);">
        <!-- Form Header -->
        <div style="text-align: center; margin-bottom: 28px;">
          <div class="brand-icon" style="margin: 0 auto 14px; width: 50px; height: 50px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="m12 19 7-7 3 3-7 7-3-3z"/>
              <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            </svg>
          </div>
          <h1 style="font-size: 1.85rem; margin-bottom: 6px;">Artist Patron Sign In</h1>
          <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0;">Access your Sabahz Studio cart, wishlist, and past orders.</p>
        </div>

        <!-- Invalid Credentials / Error Alert Banner -->
        <div id="login-error-alert" class="alert alert-error" style="display: none;" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0;">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div id="login-error-message">Invalid studio credentials.</div>
        </div>

        <!-- Login Form -->
        <form id="login-form" novalidate>
          <!-- Email / Username Field -->
          <div class="form-group">
            <label class="form-label" for="login-email">
              Studio Email or Username <span class="required">*</span>
            </label>
            <input 
              type="email" 
              id="login-email" 
              class="form-control" 
              placeholder="artist@studio.com" 
              required 
              autocomplete="email"
              value="artist.patron@studio.com"
            />
            <div id="email-val-error" style="color: var(--error); font-size: 0.75rem; margin-top: 4px; display: none;"></div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" for="login-password" style="margin-bottom: 0;">
                Password <span class="required">*</span>
              </label>
              <a href="#" onclick="Toast.info('Password recovery link sent to registered email.');" style="font-size: 0.75rem; color: var(--secondary); font-weight: 600;">Forgot password?</a>
            </div>
            <input 
              type="password" 
              id="login-password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
              value="masterpiece2026"
            />
            <div id="pass-val-error" style="color: var(--error); font-size: 0.75rem; margin-top: 4px; display: none;"></div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-checkbox-label">
              <input type="checkbox" id="login-remember" checked />
              <span>Remember this studio session</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit">
            Sign In to Art Flair
          </button>
        </form>

        <!-- Footer / Link to Registration -->
        <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary); border-top: 1px solid var(--border-light); padding-top: 20px;">
          Don't have an atelier account? <br />
          <a href="register.html" style="color: var(--primary); font-weight: 700; margin-top: 6px; display: inline-block;">
            Register New Studio Account →
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Dynamic Global Footer -->
  <div id="site-footer-container"></div>

  <!-- Global Scripts -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/services/productService.js"></script>
  <script src="js/services/cartService.js"></script>
  <script src="js/services/wishlistService.js"></script>
  <script src="js/services/aiService.js"></script>
  <script src="js/search.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/product-card.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/main.js"></script>

  <!-- Login Form Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('btn-login-submit');
      const errorAlert = document.getElementById('login-error-alert');
      const errorMessage = document.getElementById('login-error-message');
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      const rememberInput = document.getElementById('login-remember');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';

        const email = emailInput.value.trim();
        const password = passInput.value;
        const rememberMe = rememberInput ? rememberInput.checked : false;

        // Basic frontend validation
        if (!email) {
          showError('Please enter your studio email address.');
          emailInput.focus();
          return;
        }

        if (!password) {
          showError('Please enter your password.');
          passInput.focus();
          return;
        }

        // Loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <span style="display: inline-flex; align-items: center; gap: 8px;">
            <span class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin: 0; border-top-color: white;"></span>
            Authenticating...
          </span>
        `;

        try {
          const res = await loginUser({ email, password, rememberMe });
          Toast.success(`Welcome back, ${res.user.name}!`);
          const urlParams = new URLSearchParams(window.location.search);
          const redirectTarget = urlParams.get('redirect') || 'index.html';
          setTimeout(() => {
            window.location.href = redirectTarget;
          }, 600);
        } catch (err) {
          showError(err.message || 'Invalid credentials. Please verify your email and password.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Art Flair';
        }
      });

      function showError(msg) {
        if (errorMessage) errorMessage.textContent = msg;
        if (errorAlert) errorAlert.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
