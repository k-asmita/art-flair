<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Atelier Account | Art Flair - Sabahz Trading</title>
  <meta name="description" content="Create a new Art Flair artist account to access studio discounts, save custom palettes, and sync database orders." />
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- Dynamic Global Header -->
  <div id="site-header-container"></div>

  <main class="main-content section-padding">
    <div class="container container-narrow">
      <div style="max-width: 480px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 40px 32px; box-shadow: var(--shadow-lg);">
        <!-- Form Header -->
        <div style="text-align: center; margin-bottom: 28px;">
          <div class="brand-icon" style="margin: 0 auto 14px; width: 50px; height: 50px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="m12 19 7-7 3 3-7 7-3-3z"/>
              <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            </svg>
          </div>
          <h1 style="font-size: 1.85rem; margin-bottom: 6px;">Register Studio Account</h1>
          <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0;">Join the Sabahz Trading fine art patron network.</p>
        </div>

        <!-- Registration Error Alert Banner -->
        <div id="register-error-alert" class="alert alert-error" style="display: none;" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0;">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div id="register-error-message">Registration could not be completed.</div>
        </div>

        <!-- Registration Form -->
        <form id="register-form" novalidate>
          <!-- Full / Atelier Name -->
          <div class="form-group">
            <label class="form-label" for="reg-name">
              Artist or Atelier Name <span class="required">*</span>
            </label>
            <input 
              type="text" 
              id="reg-name" 
              class="form-control" 
              placeholder="e.g. Leonardo da Vinci / Studio Giverny" 
              required 
              autocomplete="name"
            />
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label class="form-label" for="reg-email">
              Studio Email Address <span class="required">*</span>
            </label>
            <input 
              type="email" 
              id="reg-email" 
              class="form-control" 
              placeholder="artist@studio.com" 
              required 
              autocomplete="email"
            />
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="reg-password">
              Password (Min 8 Characters) <span class="required">*</span>
            </label>
            <input 
              type="password" 
              id="reg-password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="new-password"
            />
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">
              Confirm Password <span class="required">*</span>
            </label>
            <input 
              type="password" 
              id="reg-confirm-password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="new-password"
            />
          </div>

          <!-- Terms Agreement -->
          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-checkbox-label" style="font-size: 0.8rem; align-items: flex-start;">
              <input type="checkbox" id="reg-terms" required checked style="margin-top: 2px;" />
              <span>I agree to Sabahz Trading's <a href="#terms" onclick="Toast.info('Terms & Conditions: 100% Archival Grade Guarantee.');" style="color: var(--primary); text-decoration: underline;">Terms of Service</a> & <a href="#privacy" onclick="Toast.info('Privacy Policy: Encrypted data protection.');" style="color: var(--primary); text-decoration: underline;">Privacy Policy</a>.</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-secondary btn-block btn-lg" id="btn-register-submit">
            Create Studio Account
          </button>
        </form>

        <!-- Footer / Link to Login -->
        <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary); border-top: 1px solid var(--border-light); padding-top: 20px;">
          Already have an atelier account? <br />
          <a href="login.html" style="color: var(--primary); font-weight: 700; margin-top: 6px; display: inline-block;">
            Sign In to Existing Account →
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Dynamic Global Footer -->
  <div id="site-footer-container"></div>

  <!-- Global Scripts -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/services/productService.js"></script>
  <script src="js/services/cartService.js"></script>
  <script src="js/services/wishlistService.js"></script>
  <script src="js/services/aiService.js"></script>
  <script src="js/search.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/product-card.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/main.js"></script>

  <!-- Registration Form Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      const submitBtn = document.getElementById('btn-register-submit');
      const errorAlert = document.getElementById('register-error-alert');
      const errorMessage = document.getElementById('register-error-message');
      const nameInput = document.getElementById('reg-name');
      const emailInput = document.getElementById('reg-email');
      const passInput = document.getElementById('reg-password');
      const confirmInput = document.getElementById('reg-confirm-password');
      const termsInput = document.getElementById('reg-terms');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passInput.value;
        const confirmPassword = confirmInput.value;

        // 1. Client-side validations
        if (!name) {
          showError('Please enter your artist or atelier name.');
          nameInput.focus();
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          showError('Please enter a valid studio email address.');
          emailInput.focus();
          return;
        }

        if (!password || password.length < 8) {
          showError('Password must be at least 8 characters long.');
          passInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showError('Password confirmation does not match.');
          confirmInput.focus();
          return;
        }

        if (termsInput && !termsInput.checked) {
          showError('Please agree to the Terms of Service & Privacy Policy.');
          return;
        }

        // 2. Loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <span style="display: inline-flex; align-items: center; gap: 8px;">
            <span class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin: 0; border-top-color: white;"></span>
            Creating Studio Account...
          </span>
        `;

        try {
          // 3. Register user via auth.js API function
          const res = await registerUser({ name, email, password, confirmPassword });
          Toast.success(`Atelier account created for ${res.user.name}!`);
          const urlParams = new URLSearchParams(window.location.search);
          const redirectTarget = urlParams.get('redirect') || 'index.html';
          setTimeout(() => {
            window.location.href = redirectTarget;
          }, 600);
        } catch (err) {
          showError(err.message || 'Registration failed. The email may already be in use.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Studio Account';
        }
      });

      function showError(msg) {
        if (errorMessage) errorMessage.textContent = msg;
        if (errorAlert) errorAlert.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
